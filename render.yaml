services:
  # -------------------------------------------------
  # Backend – Node/Express (Free tier Web Service)
  # -------------------------------------------------
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: "5000"
    healthCheckPath: /api/health

  # -------------------------------------------------
  # Frontend – Vite static site (Always Free)
  # -------------------------------------------------
  - type: web
    name: portfolio-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
